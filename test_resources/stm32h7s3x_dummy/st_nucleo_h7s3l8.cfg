source [find interface/stlink-dap.cfg]

transport select dapdirect_swd

source [find target/stm32h7rx.cfg]

# target/stm32h7rx.cfg now creates $_CHIPNAME.etf itself (ap-num 0, circular
# mode) - this used to be created here too, redundantly, with different
# (stale) params (ap-num 2, no mode), which OpenOCD now rejects outright
# ("TMC '...' already exists").

reset_config srst_only
